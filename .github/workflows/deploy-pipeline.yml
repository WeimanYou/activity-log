name: CI/CD Deployment Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允許你手動在 GitHub 網頁上觸發測試

jobs:
  # 第一階段：打包與測試 (Build)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Project
        run: |
          npm install
          npm run build --if-present
          # 將檔案打包成 build.zip，排除不必要的暫存資料夾
          zip -r build.zip . -x "node_modules/*" ".git/*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip

  # 第二階段：部署至開發環境 (Deploy Dev)
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write # 允許 GitHub Token 建立 Release
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Dev Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          # 如果已經有同名的 tag 就先刪除（避免測試時重複執行報錯）
          gh release delete "$TAG" --cleanup-tag -y || true
          # 建立 Release
          gh release create "$TAG" build.zip --notes "$NOTE"

  # 第三階段：部署至測試環境 (Deploy Staging)
  deploy-staging:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Staging Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" build.zip --notes "$NOTE"

  # 第四階段：部署至生產環境 (Deploy Production) - 會卡住等待審核！
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Production Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" build.zip --notes "$NOTE"
